<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aura — הזנת תמלול</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c232c; --line: #2a333d;
    --text: #e6edf3; --dim: #8b98a5; --accent: #4da3ff;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f8fa; --panel: #fff; --panel-2: #f3f5f8; --line: #d8dee4;
      --text: #1f2328; --dim: #636c76; --accent: #0969da;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  header {
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 18px; margin: 0; }
  h1 small { color: var(--dim); font-weight: 400; font-size: 13px; margin-inline-start: 8px; }
  .spacer { flex: 1; }
  header a { color: var(--dim); font-size: 12.5px; text-decoration: none; }
  header a:hover { color: var(--accent); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px; display: grid; gap: 20px;
          grid-template-columns: minmax(360px, 460px) 1fr; align-items: start; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim);
       margin: 0 0 16px; font-weight: 600; }

  label { display: block; margin-bottom: 14px; }
  label > span { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 5px; }
  label > span b { color: var(--bad); font-weight: 400; }
  input, textarea, select, button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%;
  }
  textarea { resize: vertical; min-height: 92px; line-height: 1.5; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  input[readonly] { color: var(--dim); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .inline { display: flex; gap: 8px; }
  .inline > input { flex: 1; }
  .inline > button { width: auto; white-space: nowrap; padding-inline: 12px; }

  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 600; padding: 11px; margin-top: 4px;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; text-align: center; }
  kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line);
        border-radius: 4px; padding: 0 4px; background: var(--panel-2); }

  details { margin-bottom: 14px; }
  summary { color: var(--dim); font-size: 12.5px; cursor: pointer; margin-bottom: 10px; }
  summary:hover { color: var(--accent); }

  .note { border-radius: 9px; padding: 11px 14px; font-size: 13.5px; margin-bottom: 14px; }
  .note.ok  { background: color-mix(in srgb, var(--ok) 15%, var(--panel));
              border: 1px solid color-mix(in srgb, var(--ok) 42%, transparent); }
  .note.dup { background: color-mix(in srgb, var(--warn) 15%, var(--panel));
              border: 1px solid color-mix(in srgb, var(--warn) 42%, transparent); }
  .note.bad { background: color-mix(in srgb, var(--bad) 15%, var(--panel));
              border: 1px solid color-mix(in srgb, var(--bad) 42%, transparent); }
  .note b { font-weight: 650; }
  .note .sub { color: var(--dim); font-size: 12.5px; margin-top: 5px; }

  .count { display: flex; gap: 20px; margin-bottom: 14px; flex-wrap: wrap; }
  .count div { font-size: 12.5px; color: var(--dim); }
  .count b { display: block; font-size: 21px; color: var(--text); font-family: var(--mono); font-weight: 650; }

  .feed { max-height: 62vh; overflow-y: auto; margin: -4px -6px; padding: 4px 6px; }
  .msg { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; gap: 12px; }
  .msg:last-child { border-bottom: 0; }
  .msg .t { font-family: var(--mono); font-size: 12px; color: var(--dim); white-space: nowrap; padding-top: 2px; }
  .msg .b { flex: 1; min-width: 0; }
  .msg .who { font-size: 11.5px; color: var(--accent); margin-bottom: 2px; }
  .msg .tx { word-wrap: break-word; }
  .msg.rej { opacity: .72; }
  .msg.rej .tx { text-decoration: line-through; text-decoration-color: var(--bad); }
  .msg .why { font-size: 11.5px; color: var(--bad); margin-top: 3px; }
  .empty { color: var(--dim); font-size: 13.5px; padding: 18px 2px; text-align: center; }

  .drop { border: 1.5px dashed var(--line); border-radius: 9px; padding: 14px;
          text-align: center; font-size: 13px; color: var(--dim); background: var(--panel-2); }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .drop button { width: auto; padding: 3px 10px; font-size: 13px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>aura <small>הזנת תמלול טיסה</small></h1>
  <div class="spacer"></div>
  <a href="/ops">מצב המערכת</a>
  <a href="/docs">API</a>
</header>

<div class="wrap">
  <div class="card">
    <h2>משפט חדש</h2>
    <div id="out"></div>

    <label>
      <span>מזהה טיסה <b>*</b></span>
      <div class="inline">
        <input id="flight" placeholder="flight-01" autocomplete="off" list="known">
        <datalist id="known"></datalist>
      </div>
    </label>

    <div class="pair">
      <label>
        <span>דובר / מקור <b>*</b></span>
        <select id="source">
          <option value="operator">operator — מפעיל</option>
          <option value="ops">ops — בקרה</option>
          <option value="pilot">pilot — טייס</option>
          <option value="__other">אחר…</option>
        </select>
      </label>
      <label>
        <span>ערוץ</span>
        <input id="channel" value="command" autocomplete="off">
      </label>
    </div>
    <label id="source-other" style="display:none">
      <span>שם המקור</span>
      <input id="source-free" placeholder="למשל intel" autocomplete="off">
    </label>

    <label>
      <span>זמן המשפט (UTC) <b>*</b></span>
      <div class="inline">
        <input id="ts" autocomplete="off">
        <button id="now-btn" type="button" title="עכשיו">עכשיו</button>
      </div>
    </label>

    <label>
      <span>המשפט <b>*</b></span>
      <textarea id="text" placeholder="בקרה, נץ אחת, קשר עם מטרה אלפא, טווח שני קילומטר." autofocus></textarea>
    </label>

    <details>
      <summary>שדות נוספים</summary>
      <label>
        <span>מזהה הודעה מהמקור — ריק = נגזר אוטומטית</span>
        <input id="mid" placeholder="flight-01-m07" autocomplete="off">
      </label>
      <label style="margin-bottom:0">
        <span>העלאת קובץ תמלול שלם</span>
        <div class="drop" id="drop">
          <input type="file" id="pick" accept=".txt,.text,text/plain" hidden>
          גרור קובץ לכאן או <button id="browse" type="button">בחר</button>
          <div class="mono" style="margin-top:6px">message_id | timestamp | source | channel | text</div>
          <div style="margin-top:5px">הטיסה נלקחת משדה "מזהה טיסה" שלמעלה, או משורת <span class="mono">#&nbsp;flight_id:</span> בקובץ</div>
        </div>
      </label>
    </details>

    <button class="primary" id="send">שלח משפט</button>
    <div class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> שולח מתוך תיבת הטקסט</div>
  </div>

  <div class="card">
    <h2>התמלול <span id="which" class="mono" style="text-transform:none"></span></h2>
    <div class="count">
      <div><b id="c-ok">0</b>נקלטו</div>
      <div><b id="c-dup">0</b>כפילויות</div>
      <div><b id="c-bad">0</b>נדחו</div>
    </div>
    <div class="feed" id="feed"><div class="empty">בחר טיסה או שלח משפט ראשון</div></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const REASONS = {
  missing_required_field: "חסר שדה חובה",
  empty_text: "המשפט ריק",
  invalid_timestamp: "חותמת זמן לא תקינה",
  schema_invalid: "המבנה אינו תקין",
};
// הודעות שנדחו נשמרות רק בדף: הן אינן נכנסות למאגר הגולמי, ולכן אין
// מאיפה לשלוף אותן אחרי רענון - וזה בכוונה.
let rejected = [];

const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function nowUTC() {
  return new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
}

function sourceValue() {
  const s = $("source").value;
  return s === "__other" ? $("source-free").value.trim() : s;
}

function remember() {
  try {
    localStorage.setItem("aura.entry", JSON.stringify({
      flight: $("flight").value, source: $("source").value,
      free: $("source-free").value, channel: $("channel").value,
    }));
  } catch (e) { /* פרטי/חסום - לא קריטי */ }
}

function restore() {
  try {
    const s = JSON.parse(localStorage.getItem("aura.entry") || "{}");
    if (s.flight) $("flight").value = s.flight;
    if (s.source) $("source").value = s.source;
    if (s.free) $("source-free").value = s.free;
    if (s.channel) $("channel").value = s.channel;
  } catch (e) { /* ללא זיכרון מקומי - הדף עובד כרגיל */ }
  toggleOther();
}

function toggleOther() {
  $("source-other").style.display = $("source").value === "__other" ? "block" : "none";
}

function say(kind, html) {
  $("out").innerHTML = `<div class="note ${kind}">${html}</div>`;
}

async function loadFlights() {
  try {
    const flights = await (await fetch("/flights")).json();
    $("known").innerHTML = flights.map((f) => `<option value="${esc(f)}">`).join("");
  } catch (e) { /* הרשימה היא נוחות בלבד */ }
}

async function loadFeed() {
  const id = $("flight").value.trim();
  $("which").textContent = id ? `· ${id}` : "";
  if (!id) {
    $("feed").innerHTML = '<div class="empty">בחר טיסה או שלח משפט ראשון</div>';
    $("c-ok").textContent = $("c-dup").textContent = 0;
    return;
  }
  let msgs = [];
  try {
    const r = await fetch(`/flights/${encodeURIComponent(id)}/messages?limit=500`);
    if (r.ok) msgs = await r.json();
  } catch (e) {
    $("feed").innerHTML = '<div class="empty">השירות לא נגיש</div>';
    return;
  }
  $("c-ok").textContent = msgs.length;

  const mine = rejected.filter((r) => r.flight_id === id);
  $("c-bad").textContent = mine.length;

  const items = [
    ...msgs.map((m) => ({ ts: m.timestamp, source: m.source, channel: m.channel,
                          text: m.text, id: m.id, rej: null })),
    ...mine.map((r) => ({ ts: r.timestamp, source: r.source, channel: r.channel,
                          text: r.text, id: r.id, rej: r.reason })),
  ].sort((a, b) => String(b.ts).localeCompare(String(a.ts)));

  $("feed").innerHTML = items.length
    ? items.map((m) => `<div class="msg ${m.rej ? "rej" : ""}">
        <div class="t">${m.ts ? new Date(m.ts).toLocaleTimeString("he-IL") : "—"}</div>
        <div class="b">
          <div class="who">${esc(m.source || "—")}${m.channel ? " · " + esc(m.channel) : ""}</div>
          <div class="tx">${esc(m.text) || "<i>(ריק)</i>"}</div>
          ${m.rej ? `<div class="why">נדחה — ${esc(REASONS[m.rej] || m.rej)}</div>` : ""}
        </div>
      </div>`).join("")
    : '<div class="empty">אין משפטים בטיסה הזו</div>';
}

async function send() {
  const flight = $("flight").value.trim();
  const text = $("text").value;
  const source = sourceValue();
  const ts = $("ts").value.trim();

  if (!flight) { say("bad", "חסר מזהה טיסה."); $("flight").focus(); return; }
  if (!text.trim()) { say("bad", "המשפט ריק."); $("text").focus(); return; }

  const payload = { flight_id: flight, timestamp: ts, source, text };
  const channel = $("channel").value.trim();
  if (channel) payload.channel = channel;
  const mid = $("mid").value.trim();
  if (mid) payload.id = mid;

  $("send").disabled = true;
  try {
    const r = await fetch("/messages", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    });
    const d = await r.json();

    if (d.status === "accepted") {
      const stored = d.message.text;
      const changed = stored !== text;
      say("ok", `<b>נקלט.</b> <span class="mono">${esc(d.message.id)}</span>` +
        (changed ? `<div class="sub">נורמל ל: "${esc(stored)}" — הנוסח המקורי נשמר.</div>` : ""));
      $("text").value = "";
      $("mid").value = "";
      $("ts").value = nowUTC();
      $("text").focus();
    } else if (d.status === "duplicate") {
      say("dup", `<b>כפילות.</b> המשפט הזה כבר נקלט` +
        `<div class="sub">לא נכנס שוב לעיבוד. שינוי הזמן או הטקסט יהפוך אותו להודעה חדשה.</div>`);
    } else {
      const reason = d.dead_letter?.reason;
      rejected.unshift({ ...payload, reason });
      say("bad", `<b>נדחה — ${esc(REASONS[reason] || reason)}.</b>` +
        `<div class="sub">ההודעה נרשמה בלוג הדחיות עם הסיבה, ולא נכנסה למאגר.</div>`);
    }
    await loadFlights();
    await loadFeed();
  } catch (e) {
    say("bad", `<b>השליחה נכשלה.</b><div class="sub">${esc(e.message)} — ודא שהשירות רץ.</div>`);
  } finally {
    $("send").disabled = false;
    remember();
  }
}

// --- העלאת קובץ (משני) ---------------------------------------------------
const drop = $("drop");
$("browse").onclick = (e) => { e.preventDefault(); $("pick").click(); };
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.add("over");
}));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => {
  e.preventDefault(); drop.classList.remove("over");
}));
drop.addEventListener("drop", (e) => upload(e.dataTransfer.files[0]));
$("pick").onchange = (e) => upload(e.target.files[0]);

// הודעות השגיאה של ה-API מנוסחות למי שקורא אותן ב-Swagger. בקליינט הן
// מתורגמות להוראה מעשית, אחרת המשתמש מקבל טקסט מפתחים ולא יודע מה לעשות.
const UPLOAD_ERRORS = [
  ["no flight_id", "אין מזהה טיסה בקובץ. הזן מזהה טיסה בשדה שלמעלה ונסה שוב."],
  ["no message lines", "לא נמצאו שורות הודעה בקובץ. כל שורה צריכה להיות " +
    "<span class='mono'>message_id | timestamp | source | channel | text</span>."],
  ["not valid UTF-8", "הקובץ אינו בקידוד UTF-8. שמור אותו מחדש כ-UTF-8 (עברית ב-cp1255 " +
    "הייתה נקלטת כג'יבריש)."],
  ["file is empty", "הקובץ ריק."],
  ["the limit is", "הקובץ גדול מהמותר (עד 5MB)."],
];

function explainUploadError(detail) {
  const text = String(detail ?? "");
  for (const [needle, message] of UPLOAD_ERRORS) {
    if (text.includes(needle)) return message;
  }
  return esc(text);
}

/** מחפש את ההנחיה בקובץ בצד הלקוח, כדי לא לשלוח העלאה שתיכשל ממילא. */
async function flightIdInFile(file) {
  try {
    const head = await file.slice(0, 8192).text();
    const match = head.match(/^#\s*flight_id\s*:\s*([^\s#]+)\s*$/m);
    return match ? match[1] : null;
  } catch (e) {
    return null;   // לא הצלחנו לקרוא - נשלח ונתן לשרת להחליט
  }
}

async function upload(file) {
  if (!file) return;

  const flight = $("flight").value.trim();
  if (!flight && !(await flightIdInFile(file))) {
    say("bad", "<b>צריך מזהה טיסה.</b><div class=\"sub\">בקובץ הזה אין שורת " +
      "<span class='mono'>#&nbsp;flight_id:</span>, לכן הזן מזהה טיסה בשדה שלמעלה " +
      "ואז גרור את הקובץ שוב.</div>");
    $("flight").focus();
    $("pick").value = "";
    return;
  }

  const body = new FormData();
  body.append("file", file);
  if (flight) body.append("flight_id", flight);
  say("ok", "קולט את הקובץ…");
  try {
    const r = await fetch("/messages/upload", { method: "POST", body });
    const d = await r.json();
    if (!r.ok) {
      say("bad", `<b>הקובץ לא נקלט.</b><div class="sub">${explainUploadError(d.detail)}</div>`);
      return;
    }
    $("flight").value = d.report.flight_id;
    say("ok", `<b>${esc(file.name)}</b> נקלט לטיסה <span class="mono">${esc(d.report.flight_id)}</span>` +
      `<div class="sub">נקלטו ${d.accepted_count} · כפילויות ${d.duplicate_count} · נדחו ${d.dead_letter_count}</div>`);
    d.results.filter((x) => x.dead_letter).forEach((x) => {
      const raw = x.dead_letter.raw_payload || {};
      rejected.unshift({ flight_id: d.report.flight_id, timestamp: raw.timestamp,
                         source: raw.source, channel: raw.channel, text: raw.text,
                         id: raw.id, reason: x.dead_letter.reason });
    });
    await loadFlights();
    await loadFeed();
  } catch (e) {
    say("bad", `<b>ההעלאה נכשלה.</b><div class="sub">${esc(e.message)}</div>`);
  }
}

$("send").onclick = send;
$("now-btn").onclick = () => { $("ts").value = nowUTC(); };
$("source").onchange = () => { toggleOther(); remember(); };
$("channel").onchange = remember;
$("flight").onchange = () => { remember(); loadFeed(); };
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});

$("ts").value = nowUTC();
restore();
loadFlights();
loadFeed();
</script>
</body>
</html>
