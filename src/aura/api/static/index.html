<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aura — מצב המערכת</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c232c; --line: #2a333d;
    --text: #e6edf3; --dim: #8b98a5; --accent: #4da3ff;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --idle: #484f58;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f8fa; --panel: #fff; --panel-2: #f0f3f6; --line: #d8dee4;
      --text: #1f2328; --dim: #636c76; --accent: #0969da; --idle: #afb8c1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
    padding: 18px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 19px; margin: 0; letter-spacing: .2px; }
  h1 small { color: var(--dim); font-weight: 400; font-size: 13px; margin-inline-start: 8px; }
  .spacer { flex: 1; }
  .meta { color: var(--dim); font-size: 13px; font-family: var(--mono); }
  main { padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  section.wide { grid-column: 1 / -1; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
       margin: 0 0 12px; font-weight: 600; }
  .kpis { display: flex; flex-wrap: wrap; gap: 18px; }
  .kpi .n { font-size: 27px; font-weight: 650; font-family: var(--mono); line-height: 1.1; }
  .kpi .l { color: var(--dim); font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; vertical-align: 1px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .dot.warn { background: var(--warn); } .dot.idle { background: var(--idle); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.mono, .mono { font-family: var(--mono); font-size: 12.5px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11.5px;
          border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .stages { display: flex; flex-wrap: wrap; gap: 6px; }
  .stage { width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center;
           font-family: var(--mono); font-size: 13px; border: 1px solid var(--line);
           background: var(--panel-2); color: var(--dim); }
  .stage.built { background: color-mix(in srgb, var(--ok) 20%, var(--panel-2));
                 border-color: color-mix(in srgb, var(--ok) 50%, transparent); color: var(--text); }
  .stage.next { border-color: var(--accent); color: var(--accent); }
  button, select {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .msgs { max-height: 340px; overflow-y: auto; }
  .empty { color: var(--dim); font-size: 13px; padding: 6px 2px; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--ok); }
  #err { display: none; background: color-mix(in srgb, var(--bad) 16%, var(--panel));
         border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent);
         color: var(--text); padding: 10px 14px; margin: 16px 16px 0; border-radius: 8px; font-size: 13.5px; }
  a { color: var(--accent); }
  @media (max-width: 560px) { main { padding: 12px 16px; } header { padding: 14px 16px; } }
</style>
</head>
<body>
<header>
  <h1>aura <small>מצב המערכת</small></h1>
  <div class="spacer"></div>
  <span class="meta" id="hdr">טוען…</span>
  <select id="every" title="קצב רענון">
    <option value="0">ללא רענון</option>
    <option value="5000" selected>כל 5 שניות</option>
    <option value="15000">כל 15 שניות</option>
    <option value="60000">כל דקה</option>
  </select>
  <button id="now">רענן</button>
  <a class="meta" href="/docs">Swagger</a>
</header>

<div id="err"></div>

<main>
  <section>
    <h2>השירות</h2>
    <div class="kpis">
      <div class="kpi"><div class="n" id="k-msgs">—</div><div class="l">משפטים במאגר</div></div>
      <div class="kpi"><div class="n" id="k-flights">—</div><div class="l">טיסות</div></div>
      <div class="kpi"><div class="n" id="k-queue">—</div><div class="l">בתור</div></div>
      <div class="kpi"><div class="n" id="k-dl">—</div><div class="l">dead-letter</div></div>
    </div>
  </section>

  <section>
    <h2>מודל ה-LLM</h2>
    <table id="t-llm"></table>
  </section>

  <section>
    <h2>המאגר הגולמי</h2>
    <table id="t-store"></table>
  </section>

  <section>
    <h2>ספי החלון בתוקף</h2>
    <table id="t-win"></table>
  </section>

  <section class="wide">
    <h2>שלבי תכנית העבודה</h2>
    <div class="stages" id="stages"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="l meta" id="stage-note" style="margin-top:8px"></div>
  </section>

  <section class="wide">
    <h2>רכיבים</h2>
    <table id="t-comp"></table>
  </section>

  <section class="wide">
    <h2>תמלול</h2>
    <div class="row">
      <select id="flight"><option value="">— בחר טיסה —</option></select>
      <span class="meta" id="flight-meta"></span>
    </div>
    <div class="msgs"><table id="t-msgs"></table></div>
  </section>

  <section class="wide">
    <h2>הודעות שנדחו</h2>
    <table id="t-dl"></table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let timer = null;

async function api(path) {
  const r = await fetch(path, { headers: { accept: "application/json" } });
  if (!r.ok) throw new Error(path + " → " + r.status);
  return r.json();
}

function fmtBytes(n) {
  if (!n) return "0 B";
  const u = ["B", "KB", "MB", "GB"];
  const i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), u.length - 1);
  return (n / 1024 ** i).toFixed(i ? 1 : 0) + " " + u[i];
}

function fmtDuration(s) {
  if (s < 60) return Math.round(s) + " שנ'";
  if (s < 3600) return Math.floor(s / 60) + " דק'";
  const h = Math.floor(s / 3600);
  return h + " שע' " + Math.floor((s % 3600) / 60) + " דק'";
}

function rows(table, pairs) {
  table.innerHTML = pairs
    .map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`)
    .join("");
}

function pill(ok, text, kind) {
  const cls = kind || (ok ? "ok" : "bad");
  return `<span class="pill ${cls}">${text}</span>`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

function renderStatus(s) {
  $("hdr").textContent = `v${s.version} · ${fmtDuration(s.uptime_seconds)} · ${new Date().toLocaleTimeString("he-IL")}`;
  $("k-msgs").textContent = s.store.message_count.toLocaleString("he-IL");
  $("k-flights").textContent = s.store.flight_count;
  $("k-queue").textContent = s.queue_depth;
  $("k-dl").textContent = s.dead_letters.total;

  const llm = s.llm;
  const configured = llm.configured_model;
  rows($("t-llm"), [
    ["ollama", llm.reachable
      ? pill(true, "זמין") + ` <span class="meta">${esc(llm.base_url)}</span>`
      : pill(false, "לא זמין") + ` <span class="meta">${esc(llm.error || "")}</span>`],
    ["מודל מוגדר", `<span class="mono">${esc(configured)}</span><br>` +
      (llm.configured_model_available ? pill(true, "מותקן") : pill(false, "לא מותקן"))],
    ["מודלים מותקנים", llm.available_models.length
      ? llm.available_models.map((m) => `<div class="mono">${esc(m)}</div>`).join("")
      : '<span class="empty">אין</span>'],
    ["טעון בזיכרון", llm.loaded_models.length
      ? llm.loaded_models.map((m) => `<div class="mono">${esc(m)}</div>`).join("")
      : '<span class="empty">אין</span>'],
  ]);

  rows($("t-store"), [
    ["קובץ", `<span class="mono">${esc(s.store.path)}</span>`],
    ["קיים", s.store.exists ? pill(true, "כן") : pill(false, "לא נוצר עוד")],
    ["גודל", fmtBytes(s.store.size_bytes)],
    ["append-only", pill(true, "נאכף בטריגרים")],
  ]);

  const w = s.window_settings;
  rows($("t-win"), [
    ["סף שתיקה", w.silence_threshold_seconds + " שנ'"],
    ["אורך מרבי", w.max_duration_seconds + " שנ'"],
    ["משפטים מרבי", w.max_sentences],
    ["חפיפה", w.overlap_sentences + " משפטים"],
    ["סגירה בהחלפת דובר", w.close_on_speaker_change ? pill(null, "דולק", "warn") : pill(true, "כבוי")],
    ["תקציב טוקנים", w.max_tokens_per_window.toLocaleString("he-IL")],
  ]);

  const built = new Set(s.stages_built);
  const next = Math.min(...Array.from({ length: s.stages_total }, (_, i) => i).filter((i) => !built.has(i)));
  $("stages").innerHTML = Array.from({ length: s.stages_total }, (_, i) =>
    `<div class="stage ${built.has(i) ? "built" : ""} ${i === next ? "next" : ""}" title="שלב ${i}">${i}</div>`
  ).join("");
  $("bar").style.width = (built.size / s.stages_total * 100).toFixed(1) + "%";
  $("stage-note").textContent =
    `${built.size} מתוך ${s.stages_total} שלבים נבנו. הבא בתור: שלב ${next}.`;

  $("t-comp").innerHTML =
    "<tr><th>#</th><th>רכיב</th><th>שלב</th><th>מצב</th><th>חשוף ב-API</th></tr>" +
    s.components.map((c) => `<tr>
      <td class="mono">${c.id}</td>
      <td>${esc(c.name_he)}</td>
      <td class="mono">${c.stage}</td>
      <td>${c.built ? pill(true, "נבנה") : pill(null, "טרם", "idle")}</td>
      <td>${c.exposed_over_http ? '<span class="dot ok"></span>' : '<span class="dot idle"></span>'}</td>
    </tr>`).join("");
}

function renderDeadLetters(records) {
  if (!records.length) {
    $("t-dl").innerHTML = '<tr><td class="empty">אין הודעות שנדחו</td></tr>';
    return;
  }
  $("t-dl").innerHTML =
    "<tr><th>סיבה</th><th>טיסה</th><th>זמן דחייה</th><th>מקור גולמי</th></tr>" +
    records.map((r) => `<tr>
      <td>${pill(false, esc(r.reason))}</td>
      <td class="mono">${esc(r.flight_id ?? "—")}</td>
      <td class="mono">${new Date(r.recorded_at).toLocaleString("he-IL")}</td>
      <td class="mono">${esc(JSON.stringify(r.raw_payload)).slice(0, 110)}</td>
    </tr>`).join("");
}

async function loadFlights(keep) {
  const flights = await api("/flights");
  const sel = $("flight");
  const chosen = keep || sel.value;
  sel.innerHTML = '<option value="">— בחר טיסה —</option>' +
    flights.map((f) => `<option value="${esc(f)}">${esc(f)}</option>`).join("");
  if (chosen && flights.includes(chosen)) sel.value = chosen;
  else if (!chosen && flights.length === 1) sel.value = flights[0];
  return sel.value;
}

async function loadMessages() {
  const id = $("flight").value;
  if (!id) {
    $("t-msgs").innerHTML = '<tr><td class="empty">בחר טיסה כדי לראות את התמלול</td></tr>';
    $("flight-meta").textContent = "";
    return;
  }
  const msgs = await api(`/flights/${encodeURIComponent(id)}/messages?limit=500`);
  $("flight-meta").textContent = msgs.length
    ? `${msgs.length} משפטים · ${new Date(msgs[0].timestamp).toLocaleString("he-IL")} ← ${new Date(msgs[msgs.length - 1].timestamp).toLocaleTimeString("he-IL")}`
    : "אין משפטים";
  $("t-msgs").innerHTML = msgs.length
    ? "<tr><th>זמן</th><th>מקור</th><th>ערוץ</th><th>טקסט</th><th>מזהה</th></tr>" +
      msgs.map((m) => `<tr>
        <td class="mono">${new Date(m.timestamp).toLocaleTimeString("he-IL")}</td>
        <td>${esc(m.source)}</td>
        <td class="meta">${esc(m.channel ?? "—")}</td>
        <td>${esc(m.text)}</td>
        <td class="mono meta">${esc(m.id)}</td>
      </tr>`).join("")
    : '<tr><td class="empty">אין משפטים בטיסה הזו</td></tr>';
}

async function refresh() {
  try {
    const [status, dl] = await Promise.all([api("/status"), api("/dead-letters?limit=50")]);
    renderStatus(status);
    renderDeadLetters(dl);
    await loadFlights();
    await loadMessages();
    $("err").style.display = "none";
  } catch (e) {
    $("err").style.display = "block";
    $("err").textContent = "השירות לא נגיש: " + e.message +
      " — ודא ש-uvicorn רץ (uvicorn aura.api:app --reload).";
  }
}

function schedule() {
  if (timer) clearInterval(timer);
  const ms = Number($("every").value);
  if (ms) timer = setInterval(refresh, ms);
}

$("now").onclick = refresh;
$("every").onchange = schedule;
$("flight").onchange = loadMessages;
refresh();
schedule();
</script>
</body>
</html>
