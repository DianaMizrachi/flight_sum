# טיסת זהב 2 - תרחיש הליבה שמוזכר בתכנית במפורש: אובדן קשר עם מטרה וחידושו
# (ראו שלב 6, בדיקות: "תרחיש מטרה A ... גם כשהשניים באותו חלון").
# המשפטים m04 ו-m05 במכוון קרובים בזמן (25 שניות) כך שיוכלו להיכנס לאותו
# חלון בשלב 3, ובודקים שמנהל המצב (שלב 6) מעבד את שניהם לפי סדר המשפטים.
#
# אותה מוסכמת מזהה אירוע כמו בטיסה 1: "<flight_id>-evt-<message_id>".

