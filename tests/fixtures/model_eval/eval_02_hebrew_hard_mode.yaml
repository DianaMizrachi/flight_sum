    new_info_he: "זיהוי חזותי של שני בני אדם ליד מבנה ארבע, אחד נושא תיק."
    confidence_min: 0.7
    notes_he: >
      תווית הישות היא טקסט חופשי - ההשוואה צריכה להיות סלחנית לנוסח
      ("שני חשודים", "שני בני אדם ליד מבנה ארבע") ונוקשה לסוג ולמספר.

  - key: contact-not-continuous
    type: loss_of_contact
    relation_to_previous: updates
    source_ids: [eval-02-m04]
    entities:
      - type: target
        label: "שני חשודים ליד מבנה ארבע"
    new_info_he: "אין קשר רצוף עם החשודים, מוסתרים על ידי צמחייה."
    confidence_min: 0.7
    notes_he: >
