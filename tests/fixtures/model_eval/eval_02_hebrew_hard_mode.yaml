      קשר. מודל שמפיק כאן contact_with_target הפך את משמעות המשפט.

  - key: eo-camera-malfunction
    type: malfunction
    relation_to_previous: new
    source_ids: [eval-02-m05]
    entities:
      - type: force
        label: "נץ שלוש"
    new_info_he: >
      המצלמה האלקטרו-אופטית אינה מגיבה לפקודות הזזה, מעבר לחיישן התרמי.
    confidence_min: 0.7
    notes_he: >
      המשפט ללא פיסוק ומכיל שני חלקים (תקלה + מעבר לחיישן חלופי).
      לפי הטקסונומיה malfunction דורש גם entities וגם new_info.

optional_events:
  - key: thermal-contact-regained
    type: contact_with_target
    relation_to_previous: updates
    source_ids: [eval-02-m07]
    entities:
      - type: target
        label: "שני חשודים ליד מבנה ארבע"
    new_info_he: "בחיישן התרמי יש תמונה, החשודים נעים מזרחה, טווח 450 מטר."
    reason_optional_he: >
      חידוש הקשר בחיישן התרמי הוא לגיטימי כאירוע נפרד, אבל מודל שרואה
      אותו כהמשך של m05 ולא כאירוע חדש אינו טועה. לא נספר כשגיאה לשום
      כיוון - נרשם בנפרד כדי לראות איך כל מודל מחליט.

must_not_produce_events:
