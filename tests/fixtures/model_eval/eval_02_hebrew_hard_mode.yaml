# תרחיש הערכה 2 מתוך 3 - עברית קשה (3 דקות).
#
# מטרה: להפריד בין מודל שאומן על עברית לבין מודל רב-לשוני שעברית היא
# אצלו שפה שולית. כל מה שמופיע כאן הוא מה שבאמת מגיע מערוץ קשר אחרי
# תמלול אוטומטי, ולא מה שנוח למודל:
#
#   1. חוסר פיסוק מלא ומשפטי רצף (m01, m05) - תמלול ASR לא מפסק.
#   2. מספרים במילים, לא בספרות (m01, m07).
#   3. שלילה שנושאת את האירוע (m04: "שלילי, אין לי קשר") - מודל שמתעלם
#      מהשלילה יסמן קשר במקום אובדן קשר. זו המלכודת המרכזית כאן.
#   4. שאלה שמנוסחת כמו דיווח (m03) - אסור שתפיק אירוע.
#   5. סמיכות ומונחים מקצועיים ("המצלמה האלקטרו-אופטית", "החיישן התרמי").
#
# הציפייה: פער בולט לטובת מודל עברי דווקא ב-m01, m04 ו-m05.

scenario_id: eval-02
