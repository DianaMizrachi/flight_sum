    reason_he: >
      דיווח מיקום וגובה שגרתי. אין לו סוג בטקסונומיה, ולכן הוא בודק
      שהמודל לא ממציא אירוע רק כי הגיע משפט.
  - message_id: eval-02-m03
    reason_he: >
      שאלה מהבקרה, לא דיווח. מודל שמסיק ממנה קשר עם מטרה ענה על
      הנוסח ולא על התוכן.
  - message_id: eval-02-m06
    reason_he: "אישור קליטה והוראת המתנה."
