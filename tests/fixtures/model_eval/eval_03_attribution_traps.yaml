expected_events:
  - key: suspicious-vehicle-contact
    type: contact_with_target
    relation_to_previous: new
    source_ids: [eval-03-m01, eval-03-m02]
    entities:
      - type: target
        label: "רכב מסחרי כסוף"
    new_info_he: >
      תנועה חשודה בצומת המזרחי - רכב מסחרי כסוף עם שני נוסעים, עוצר בשול.
    confidence_min: 0.7
    notes_he: >
      שני המשפטים הם אירוע אחד: m01 מדווח על התנועה ו-m02 מזהה מה היא.
      source_ids חייב להכיל את שניהם. אם המודל מפיק שני אירועים נפרדים,
      זו שגיאת פירוק - נרשמת בנפרד משגיאת ייחוס.

  - key: vehicle-leaves-junction
    type: contact_with_target
    relation_to_previous: updates
    source_ids: [eval-03-m06]
    entities:
      - type: target
        label: "רכב מסחרי כסוף"
    new_info_he: "הרכב המסחרי יצא מהצומת מזרחה, המעקב נמשך."
    confidence_min: 0.7

  - key: mission-change-north
    type: mission_change
    relation_to_previous: new
    source_ids: [eval-03-m07]
    entities:
      - type: area
        label: "הגזרה הצפונית"
    new_info_he: >
      הוראת בקרה - הפסקת המעקב אחרי הרכב ומעבר לגזרה הצפונית בעקבות
      דיווח על תנועה.
    confidence_min: 0.7

optional_events:
  - key: vehicle-tracking-closed
    type: contact_with_target
    relation_to_previous: closes
    source_ids: [eval-03-m07]
    entities:
      - type: target
        label: "רכב מסחרי כסוף"
    new_info_he: "המעקב אחרי הרכב המסחרי הופסק לפי הוראת בקרה."
    reason_optional_he: >
      m07 נושא שני אירועים: שינוי משימה וסגירת המעקב. אירוע סגירה נוסף
      שמצביע על m07 הוא נכון ואף מועדף למצב המשימה, ולכן אינו נספר
      כשגיאה - אבל גם היעדרו אינו שגיאה בשלב 4, כי שלב 6 יכול להסיק
      את הסגירה משינוי המשימה.

must_not_produce_events:
  - message_id: eval-03-m03
    reason_he: >
      אישור שחוזר על תוכן m01+m02 במילים אחרות. אירוע שמצביע על m03
      הוא ספירה כפולה של אותו קשר - השגיאה המרכזית שהתרחיש מחפש.
  - message_id: eval-03-m04
    reason_he: >
      הוראה מותנית. לא אבד קשר ולא שונתה משימה - שניהם עדיין לא קרו.
      מודל שמפיק כאן loss_of_contact או mission_change קרא תנאי כעובדה.
  - message_id: eval-03-m05
    reason_he: "אישור קליטה."
  - message_id: eval-03-m08
    reason_he: >
      ביצוע ההוראה מ-m07, לא אירוע נוסף. שינוי המשימה נספר פעם אחת
      בלבד, במשפט שבו הוא ניתן.
