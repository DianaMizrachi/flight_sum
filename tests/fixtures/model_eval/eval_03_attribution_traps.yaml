# תרחיש הערכה 3 מתוך 3 - ייחוס מקורות (3 דקות).
#
# מטרה: קריטריון המעבר של שלב 4 הוא "כל אירוע מצביע על משפטי המקור
# הנכונים" (>=90%). התרחיש הזה בודק בדיוק את זה, ולא את זיהוי האירועים:
#
#   1. אירוע שנפרס על שני משפטים (m01+m02) - source_ids חייב להכיל את
#      שניהם. מודל שמחזיר רק אחד מהם נכשל בייחוס גם אם סוג האירוע נכון.
#   2. אישור שחוזר על התוכן (m03) - ספירה כפולה. זו השגיאה הנפוצה
#      ביותר בתמלול דו-כיווני, כי התוכן זהה לחלוטין לדיווח שקדם לו.
#   3. הוראה מותנית (m04: "אם תאבד קשר ... עבור") - עדיין לא קרה דבר.
#      לא אובדן קשר ולא שינוי משימה.
#   4. שינוי משימה שמשתמע ממנו גם סגירת מעקב (m07) - שני אירועים
#      לגיטימיים מאותו משפט, ושניהם מצביעים על m07.
#   5. ביצוע ההוראה (m08) - לא אירוע נוסף.
#
# הערה על חלונות: m01 ו-m02 מרוחקים תשע שניות ולכן ייפלו באותו חלון,
# אבל m03 הוא החלפת דובר. עם close_on_speaker_change=True החלון ייסגר
# ביניהם, ואז המודל יראה את האישור בלי הדיווח שהוא מאשר - בדיוק המצב
# שבו ספירה כפולה הופכת בלתי נמנעת. התרחיש הזה מודד גם את ההחלטה הזו.

scenario_id: eval-03
flight_id: eval-03
title_he: "מלכודות ייחוס - אירוע על שני משפטים, אישורים והוראות מותנות"
duration_seconds: 180
focus_he: "נכונות source_ids וספירה כפולה, לא זיהוי אירועים"
expected_event_count: 3

