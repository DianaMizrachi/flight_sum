# סביבת הרצה מקומית לשלב 0 (שלב 0, משימה 6): מסד נתונים ותור.
# כל הרכיבים עצמם (קליטה, בניית הקשר וכו') עדיין לא רצים כשירותים
# נפרדים - הם מתחברים לתשתית הזו משלב 1 ואילך.
#
# מודל ה-LLM אינו כאן בכוונה. ollama רץ על המארח ולא בקונטיינר:
#
#   1. שירות ollama בקומפוז פרסם את פורט 11434, אותו פורט שבו ollama
#      המותקן על המארח כבר מאזין - כלומר התנגשות ודאית ברגע שהשירות עולה.
#   2. חשיפת GPU לקונטיינר דורשת nvidia-container-toolkit, ואין בה צורך
#      כשההתקנה המקומית עובדת.
#
# התקנה והרצה על המארח:
#   ollama serve                                   # בדרך כלל כבר רץ כשירות
#   ollama pull hf.co/dicta-il/DictaLM-3.0-Nemotron-12B-Instruct-GGUF:Q4_K_M
#
# כתובת השירות נקבעת ב-``LLMConfig.base_url`` (ברירת מחדל
# http://localhost:11434), ולכן מודל שרץ על מכונה אחרת הוא שינוי הגדרה
# ולא שינוי קוד.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
