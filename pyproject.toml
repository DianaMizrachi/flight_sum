[project]
name = "aura"
version = "0.1.0"
description = "Flight transcript ingestion, event detection and mission summary system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# קבצי הנתונים של החבילה: טקסונומיית האירועים וסכמות ה-SQL של המאגר הגולמי.
[tool.setuptools.package-data]
aura = ["taxonomy/*.yaml", "raw_store/*.sql", "raw_store/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
